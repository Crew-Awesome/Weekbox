<template id="tpl-search-empty-state">
  <div class="dropdown-item empty-state" data-i18n="search.noRecent">
    No recent searches
  </div>
</template>

<template id="tpl-search-loading-item">
  <div class="dropdown-item" style="cursor: default">
    <l-hourglass
      class="weekbox-hourglass"
      size="18"
      color="currentColor"
      speed="1.75"
      bg-opacity="0.12"
      aria-hidden="true"
    ></l-hourglass>
    <span data-i18n="common.loading">Loading...</span>
  </div>
</template>

<template id="tpl-search-section-title">
  <div class="dropdown-title"></div>
</template>

<template id="tpl-search-item">
  <div class="dropdown-item">
    <i class="fa-solid" aria-hidden="true"></i>
    <span class="search-item-text"></span>
  </div>
</template>

<template id="tpl-search-remove-btn">
  <button class="history-remove" type="button">
    <i class="fa-solid fa-xmark" aria-hidden="true"></i>
  </button>
</template>
