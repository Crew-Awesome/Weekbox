<template id="tpl-engine-manager-empty">
  <div class="empty-mods-state" style="margin: auto;" data-i18n="engineManager.noEngines">No engines installed</div>
</template>

<template id="tpl-engine-manager-carousel">
  <div class="em-carousel-viewport">
    <div class="em-carousel-track"></div>
    <button class="em-nav-btn left" type="button" aria-label="Previous">
      <i class="fa-solid fa-chevron-left" aria-hidden="true"></i>
    </button>
    <button class="em-nav-btn right" type="button" aria-label="Next">
      <i class="fa-solid fa-chevron-right" aria-hidden="true"></i>
    </button>
  </div>
  <div class="em-carousel-index"></div>
</template>

<template id="tpl-engine-column-header">
  <div class="engine-column-header">
    <img src="assets/icons/exe.png" alt="" class="engine-col-icon" crossorigin="anonymous" onerror="this.src='assets/icons/exe.png'" />
    <span class="engine-col-name"></span>
  </div>
</template>

<template id="tpl-engine-version-item">
  <div class="version-item">
    <span class="version-text"></span>
    <div class="version-actions">
      <button class="engine-action-btn engine-update-btn" type="button">
        <i class="fa-solid fa-rotate" aria-hidden="true"></i>
      </button>
      <button class="engine-action-btn engine-dir-btn" type="button">
        <i class="fa-solid fa-folder-open" aria-hidden="true"></i>
      </button>
      <button class="engine-action-btn engine-delete-btn" type="button">
        <i class="fa-solid fa-trash" aria-hidden="true"></i>
      </button>
    </div>
  </div>
</template>
