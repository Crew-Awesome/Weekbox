<template id="tpl-download-choice-modal">
  <div id="download-choice-modal" class="dependency-review-overlay" hidden>
    <section class="dependency-review-modal" role="dialog" aria-modal="true" aria-labelledby="download-choice-title">
      <div class="dependency-review-heading">
        <i class="fa-solid fa-download" aria-hidden="true"></i>
        <div><h2 id="download-choice-title" data-i18n="downloads.chooseTitle">Choose Download</h2></div>
      </div>
      <div class="dependency-review-list download-choice-list"></div>
      <div class="dependency-review-actions">
        <button type="button" class="dependency-review-cancel" data-i18n="common.cancel">Cancel</button>
        <button type="button" class="dependency-review-confirm" data-i18n="common.continue">Continue</button>
      </div>
    </section>
  </div>
</template>
