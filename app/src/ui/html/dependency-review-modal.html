<template id="tpl-dependency-review-modal">
  <div id="dependency-review-modal" class="dependency-review-overlay" hidden>
    <section class="dependency-review-modal" role="dialog" aria-modal="true" aria-labelledby="dependency-review-title">
      <div class="dependency-review-heading">
        <i class="fa-solid fa-puzzle-piece" aria-hidden="true"></i>
        <div><h2 id="dependency-review-title" data-i18n="dependencies.installTitle">Install Dependencies</h2></div>
      </div>
      <div class="dependency-review-list"></div>
      <div class="dependency-review-actions">
        <button type="button" class="dependency-review-cancel" data-i18n="common.cancel">Cancel</button>
        <button type="button" class="dependency-review-confirm" data-i18n="dependencies.installSelected">Install selected</button>
      </div>
    </section>
  </div>
</template>
