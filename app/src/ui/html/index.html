<template id="tpl-mainModal">
  <div class="mod-manager-overlay" id="mod-manager-modal" style="display: none">
    <div class="mod-manager-content">
      <header class="mod-manager-header">
        <div class="mod-manager-title-group">
          <h2 data-i18n="common.mods">Mods</h2>
          <span
            class="mod-manager-title-count"
            id="mod-manager-title-count"
          ></span>
        </div>
        <div class="mod-manager-tools">
          <div class="mod-manager-search-wrap">
            <label class="mod-manager-search" for="mod-manager-search-input"
              ><i class="fa-solid fa-magnifying-glass" aria-hidden="true"></i
              ><input
                id="mod-manager-search-input"
                type="search"
                data-i18n-attr="placeholder:modManager.searchPlaceholder"
                placeholder="Search mods and tags"
                autocomplete="off"
            /></label>
            <div
              class="mod-manager-search-suggestions"
              id="mod-manager-search-suggestions"
              hidden
            ></div>
          </div>
          <div
            class="mod-manager-active-filters"
            id="mod-manager-active-filters"
            data-i18n-attr="aria-label:modManager.activeFilters"
            aria-label="Active filters"
          ></div>
        </div>
        <div class="mod-manager-header-actions">
          <button
            class="mod-manager-action-btn"
            id="mod-manager-filter-toggle"
            data-i18n-attr="title:modManager.filterSort,aria-label:modManager.filterSort"
            title="Filter and sort"
            aria-label="Filter and sort"
          >
            <i class="fa-solid fa-arrow-down-wide-short" aria-hidden="true"></i>
          </button>
          <button
            class="mod-manager-action-btn"
            id="mod-manager-add-local-btn"
            data-i18n-attr="title:modManager.addLocal,aria-label:modManager.addLocal"
            title="Add local mod"
            aria-label="Add local mod"
          >
            <i class="fa-solid fa-plus" aria-hidden="true"></i>
          </button>
          <button
            class="mod-manager-action-btn mod-manager-close-btn"
            id="mod-manager-close-btn"
            data-i18n-attr="title:common.close"
            title="Close"
          >
            <i class="fa-solid fa-xmark"></i>
          </button>
        </div>
      </header>
      <div class="mod-manager-body" id="mod-manager-modal-body"></div>
    </div>
  </div>
</template>
<template id="tpl-unassignedBadge">
  <span
    class="mod-manager-engine-indicator"
    data-label="Unassigned"
    data-i18n-attr="aria-label:import.unassigned,data-label:import.unassigned"
    role="img"
    aria-label="Unassigned"
    ><i class="fa-solid fa-question-circle" aria-hidden="true"></i
  ></span>
</template>
<template id="tpl-executableBadge">
  <span
    class="mod-manager-engine-indicator"
    data-label="Executable"
    data-i18n-attr="aria-label:home.executables,data-label:home.executables"
    role="img"
    aria-label="Executable"
    ><img src="assets/icons/exe.png" alt=""
  /></span>
</template>
<template id="tpl-engineBadge">
  <span
    class="mod-manager-engine-indicator"
    data-label="{{name}}"
    role="img"
    aria-label="{{name}}"
    ><img src="assets/icons/{{icon}}" alt=""
  /></span>
</template>
<template id="tpl-engineCompatibilityPicker">
  <div
    class="mod-manager-engine-compatibility-picker"
    data-mod-id="{{modId}}"
    data-saved-engine-id="{{engineId}}"
    data-pending-engine-id="{{engineId}}"
    data-saved-version="{{engineVersion}}"
    data-pending-version="{{engineVersion}}"
  >
    <div class="mod-manager-engine-picker">
      <button
        class="mod-manager-engine-pill"
        type="button"
        aria-expanded="false"
      >
        {{selectedEngineIconHtml}}
        <span>{{selectedEngineName}}</span
        ><i class="fa-solid fa-chevron-down" aria-hidden="true"></i>
      </button>
      <div class="mod-manager-engine-menu" hidden>
        <button
          type="button"
          data-engine-id=""
          class="{{unassignedSelectedClass}}"
        >
          <i class="fa-solid fa-question-circle" aria-hidden="true"></i
          >{{unassignedLabel}}
        </button>
        {{engineOptionsHtml}}
      </div>
    </div>
    <div class="mod-manager-version-picker">
      <button
        class="mod-manager-version-pill"
        type="button"
        aria-expanded="false"
      >
        <span>{{selectedVersion}}</span
        ><i class="fa-solid fa-chevron-down" aria-hidden="true"></i>
      </button>
      <div class="mod-manager-version-menu" hidden>{{versionOptionsHtml}}</div>
    </div>
  </div>
</template>
<template id="tpl-engineOption">
  <button
    type="button"
    data-engine-id="{{id}}"
    data-engine-name="{{name}}"
    data-engine-icon="{{icon}}"
    class="{{selectedClass}}"
  >
    <img src="assets/icons/{{icon}}" alt="" />{{name}}
  </button>
</template>
<template id="tpl-versionOption">
  <button
    type="button"
    data-version="{{versionValue}}"
    class="{{selectedClass}}"
  >
    {{version}}
  </button>
</template>
<template id="tpl-cardContent">
  <div class="mod-manager-card-bg"></div>
  <div class="mod-manager-cover-wrap">
    <div class="mod-manager-cover-placeholder" aria-hidden="true"></div>
    <img
      class="mod-manager-cover"
      data-i18n-attr="alt:common.modCover"
      alt="Mod Cover"
      loading="lazy"
      hidden
    />
    <button
      class="mod-manager-launch-btn"
      type="button"
      data-launch-kind="{{launchKind}}"
      data-mod-id="{{modId}}"
      data-engine-id="{{engineId}}"
      data-engine-version="{{engineVersion}}"
      data-launch-label="{{launchLabel}}"
      data-mod-name="{{modName}}"
      aria-label="{{launchLabel}} {{modName}}"
      {{disabledAttr}}
    >
      <i class="fa-solid fa-play" aria-hidden="true"></i
      ><span>{{launchLabel}}</span>
    </button>
  </div>
  {{engineBadgeHtml}}
  <div class="mod-manager-card-body mod-info">
    <div class="mod-manager-info">
      <h3 class="mod-title" title="{{modName}}">{{modName}}</h3>
    </div>
    <div class="mod-manager-actions">
      <button
        class="mod-action-btn mod-manager-vis-btn"
        data-i18n-attr="title:modManager.toggleVisibility"
        title="Toggle Visibility"
      >
        <i class="fa-solid {{eyeIcon}}"></i>
      </button>
      <button
        class="mod-action-btn mod-manager-settings-btn"
        data-i18n-attr="title:modManager.settings"
        title="Mod Settings"
        aria-label="Open settings for {{modName}}"
      >
        <i class="fa-solid fa-gear"></i>
      </button>
      <button
        class="mod-action-btn mod-manager-delete-btn"
        data-id="{{modId}}"
        data-i18n-attr="title:modManager.delete,aria-label:modManager.delete"
        title="Delete Mod"
      >
        <i class="fa-solid fa-trash"></i>
      </button>
    </div>
  </div>
</template>
<template id="tpl-launchButtonRunning">
  <i class="fa-solid fa-play mod-manager-running-icon" aria-hidden="true"></i
  ><span class="mod-manager-running-label" data-i18n="modManager.running"
    >Running</span
  ><span class="mod-manager-close-label"
    ><i class="fa-solid fa-xmark" aria-hidden="true"></i
    ><span data-i18n="modManager.clickToClose">Click to Close</span></span
  >
</template>
<template id="tpl-launchButtonSwitch">
  <i class="fa-solid fa-right-left" aria-hidden="true"></i
  ><span data-i18n="modManager.switchMod">Switch Mod</span>
</template>
<template id="tpl-launchButtonDefault">
  <i class="fa-solid fa-play" aria-hidden="true"></i
  ><span>{{launchLabel}}</span>
</template>
<template id="tpl-emptyState">
  <div class="empty-mods-state">{{message}}</div>
</template>
<template id="tpl-deleteSpinner">
  <i class="fa-solid fa-spinner fa-spin"></i>
</template>
<template id="tpl-deleteIcon">
  <i class="fa-solid fa-trash"></i>
</template>
<template id="tpl-unassignedQuestionIcon">
  <i class="fa-solid fa-question-circle" aria-hidden="true"></i>
</template>
<template id="tpl-openDirectoryIcon">
  <i class="fa-solid fa-folder-open" aria-hidden="true"></i>
</template>
<template id="tpl-config-modal">
  <div class="config-overlay" id="config-modal" style="display: none">
    <div class="config-content">
      <aside class="config-aside">
        <div class="config-aside-header">
          <i class="fa-solid fa-gear"></i>
          <h2 data-i18n="settings.title">Settings</h2>
        </div>
        <nav class="config-nav">
          <button class="config-tab-btn active" data-tab-target="general">
            <i class="fa-solid fa-window-maximize"></i>
            <span data-i18n="settings.general">App &amp; window</span>
          </button>
          <button class="config-tab-btn" data-tab-target="downloads">
            <i class="fa-solid fa-download"></i>
            <span data-i18n="settings.downloads">Downloads</span>
          </button>
          <button class="config-tab-btn" data-tab-target="library">
            <i class="fa-solid fa-folder-tree"></i>
            <span data-i18n="settings.library">Library &amp; Storage</span>
          </button>
          <button class="config-tab-btn" data-tab-target="updates">
            <i class="fa-solid fa-arrows-rotate"></i>
            <span data-i18n="settings.updates">Updates</span>
          </button>
          <button
            class="config-tab-btn"
            data-external-url="https://fnfweekbox.vercel.app/credits"
          >
            <i class="fa-solid fa-heart"></i>
            <span data-i18n="settings.credits">Credits</span>
            <i class="fa-solid fa-arrow-up-right-from-square" aria-hidden="true"></i>
          </button>
        </nav>
      </aside>

      <main class="config-main">
        <header class="config-header">
          <h3 id="config-section-title" data-i18n="settings.general">
            App &amp; window
          </h3>
          <button
            class="config-close-btn"
            id="config-close-btn"
            data-i18n-attr="title:common.close"
            title="Close"
          >
            <i class="fa-solid fa-xmark"></i>
          </button>
        </header>

        <div class="config-body">
          <!-- APP & WINDOW TAB -->
          <div id="config-general" class="config-tab-content active">
            <div class="settings-list">
              <div class="setting-item">
                <div class="setting-info">
                  <h4 data-i18n="settings.language">Language</h4>
                </div>
                <div class="setting-language-control">
                  <div
                    class="setting-language-dropdown mod-settings-dropdown"
                    id="setting-language-dropdown"
                  >
                    <button
                      type="button"
                      class="setting-language-trigger mod-settings-dropdown-trigger"
                      id="setting-language-trigger"
                      aria-haspopup="listbox"
                      aria-expanded="false"
                      aria-controls="setting-language-options"
                      data-i18n-attr="aria-label:settings.language"
                      aria-label="Language"
                    >
                      <span
                        id="setting-language-selected-flag"
                        class="mod-settings-select-icon setting-language-flag fi fi-us"
                        aria-hidden="true"
                      ></span>
                      <span id="setting-language-selected">English</span>
                      <i
                        class="fa-solid fa-chevron-down mod-settings-select-chevron"
                        aria-hidden="true"
                      ></i>
                    </button>
                    <div
                      class="mod-settings-dropdown-menu setting-language-menu"
                      id="setting-language-options"
                      role="listbox"
                      hidden
                      data-i18n-attr="aria-label:settings.language"
                      aria-label="Language"
                    >
                      <button
                        type="button"
                        class="setting-language-option selected"
                        data-language="en"
                        data-flag="us"
                        role="option"
                        aria-selected="true"
                      >
                        <span
                          class="setting-language-flag fi fi-us"
                          aria-hidden="true"
                        ></span>
                        <span>English</span>
                      </button>
                      <button
                        type="button"
                        class="setting-language-option"
                        data-language="es"
                        data-flag="es"
                        role="option"
                        aria-selected="false"
                      >
                        <span
                          class="setting-language-flag fi fi-es"
                          aria-hidden="true"
                        ></span>
                        <span>Español</span>
                      </button>
                      <button
                        type="button"
                        class="setting-language-option"
                        data-language="de"
                        data-flag="de"
                        role="option"
                        aria-selected="false"
                      >
                        <span
                          class="setting-language-flag fi fi-de"
                          aria-hidden="true"
                        ></span>
                        <span>Deutsch</span>
                      </button>
                      <button
                        type="button"
                        class="setting-language-option"
                        data-language="id"
                        data-flag="id"
                        role="option"
                        aria-selected="false"
                      >
                        <span
                          class="setting-language-flag fi fi-id"
                          aria-hidden="true"
                        ></span>
                        <span>Bahasa Indonesia</span>
                      </button>
                      <button
                        type="button"
                        class="setting-language-option"
                        data-language="it"
                        data-flag="it"
                        role="option"
                        aria-selected="false"
                      >
                        <span
                          class="setting-language-flag fi fi-it"
                          aria-hidden="true"
                        ></span>
                        <span>Italiano</span>
                      </button>
                      <button
                        type="button"
                        class="setting-language-option"
                        data-language="pt"
                        data-flag="pt"
                        role="option"
                        aria-selected="false"
                      >
                        <span
                          class="setting-language-flag fi fi-pt"
                          aria-hidden="true"
                        ></span>
                        <span>Português</span>
                      </button>
                      <button
                        type="button"
                        class="setting-language-option"
                        data-language="fr"
                        data-flag="fr"
                        role="option"
                        aria-selected="false"
                      >
                        <span
                          class="setting-language-flag fi fi-fr"
                          aria-hidden="true"
                        ></span>
                        <span>Français</span>
                      </button>
                    </div>
                  </div>
                  <select id="setting-language" hidden>
                    <option value="en">English</option>
                    <option value="es">Español</option>
                    <option value="de">Deutsch</option>
                    <option value="id">Bahasa Indonesia</option>
                    <option value="it">Italiano</option>
                    <option value="pt">Português</option>
                    <option value="fr">Français</option>
                  </select>
                </div>
              </div>
              <div class="setting-item">
                <div class="setting-info">
                  <h4 data-i18n="settings.launchOnStartup">
                    Launch on startup
                  </h4>
                  <p data-i18n="settings.launchOnStartupDescription">
                    Start WeekBox automatically when your PC starts.
                  </p>
                </div>
                <label class="switch">
                  <input type="checkbox" id="setting-launchOnStartup" />
                  <span class="slider round"></span>
                </label>
              </div>

              <div class="setting-item">
                <div class="setting-info">
                  <h4 data-i18n="settings.protocolLinks">Open WeekBox links</h4>
                  <p>
                    <span
                      data-i18n="settings.protocolLinksDescription"
                      data-i18n-vars='{"protocol":"weekbox://mod/1757143"}'
                      >Let links such as weekbox://mod/1757143 open in WeekBox
                      on Windows.</span
                    >
                  </p>
                </div>
                <label class="switch">
                  <input type="checkbox" id="setting-registerProtocolLinks" />
                  <span class="slider round"></span>
                </label>
              </div>

              <div class="setting-item">
                <div class="setting-info">
                  <h4 data-i18n="settings.blurOutOfFocus">Blur out of focus</h4>
                  <p data-i18n="settings.blurOutOfFocusDescription">
                    Apply a blur effect to the background when the window loses
                    focus.
                  </p>
                </div>
                <label class="switch">
                  <input type="checkbox" id="setting-blurOutOfFocus" />
                  <span class="slider round"></span>
                </label>
              </div>

              <div class="setting-item">
                <div class="setting-info">
                  <h4 data-i18n="settings.hideOnLaunch">
                    Hide window when launching
                  </h4>
                  <p data-i18n="settings.hideOnLaunchDescription">
                    Hide WeekBox while an engine is running.
                  </p>
                </div>
                <label class="switch">
                  <input type="checkbox" id="setting-hideOnLaunch" />
                  <span class="slider round"></span>
                </label>
              </div>

              <div class="setting-item wine-setting" id="wine-setting" hidden>
                <div class="setting-info">
                  <h4 data-i18n="settings.wineVersion">Wine version</h4>
                  <p data-i18n="settings.wineVersionDescription">
                    Choose the Wine version used for Windows `.exe` mods.
                  </p>
                </div>
                <div class="wine-setting-control">
                  <select
                    id="setting-wineCommand"
                    data-i18n-attr="aria-label:settings.wineVersion"
                    aria-label="Wine version"
                  ></select>
                  <button
                    type="button"
                    id="refresh-wine-versions"
                    data-i18n-attr="title:settings.findWineVersions,aria-label:settings.findWineVersions"
                    title="Find Wine versions"
                    aria-label="Find Wine versions"
                  >
                    <i class="fa-solid fa-rotate" aria-hidden="true"></i>
                  </button>
                </div>
                <p
                  class="wine-setting-status"
                  id="wine-setting-status"
                  role="status"
                ></p>
              </div>
            </div>
          </div>

          <!-- DOWNLOADS TAB -->
          <div
            id="config-downloads"
            class="config-tab-content"
            style="display: none"
          >
            <div class="settings-list">
              <div class="setting-item">
                <div class="setting-info">
                  <h4 data-i18n="settings.multithreadDownloads">
                    Multithread downloads
                  </h4>
                  <p data-i18n="settings.multithreadDownloadsDescription">
                    Use multiple connections to download large files faster.
                  </p>
                </div>
                <label class="switch">
                  <input type="checkbox" id="setting-multithreadDownloads" />
                  <span class="slider round"></span>
                </label>
              </div>
              <div class="setting-item">
                <div class="setting-info">
                  <h4 data-i18n="settings.autoStartAfterDownload">
                    Open engines after downloading
                  </h4>
                  <p data-i18n="settings.autoStartAfterDownloadDescription">
                    Start an engine automatically once its download finishes.
                  </p>
                </div>
                <label class="switch">
                  <input type="checkbox" id="setting-autoStartAfterDownload" />
                  <span class="slider round"></span>
                </label>
              </div>
            </div>
          </div>

          <!-- LIBRARY TAB -->
          <div
            id="config-library"
            class="config-tab-content"
            style="display: none"
          >
            <div class="settings-list">
              <div class="setting-item setting-item-storage">
                <div class="setting-info">
                  <h4 data-i18n="settings.storageLocation">
                    WeekBox storage location
                  </h4>
                  <button
                    type="button"
                    id="storage-location-path"
                    data-i18n-attr="title:settings.openStorageFolder"
                    title="Open WeekBox storage folder"
                  >
                    <span data-i18n="settings.loadingLocation"
                      >Loading current location…</span
                    >
                  </button>
                </div>
                <div class="storage-location-actions">
                  <button
                    type="button"
                    class="storage-location-button"
                    id="choose-storage-location"
                  >
                    <i class="fa-solid fa-folder-open"></i>
                    <span data-i18n="common.chooseFolder">Choose folder</span>
                  </button>
                  <button
                    type="button"
                    class="storage-location-button"
                    id="use-default-storage-location"
                  >
                    <span data-i18n="common.useDefault">Use default</span>
                  </button>
                </div>
              </div>
              <div class="setting-item setting-item-storage">
                <div class="setting-info">
                  <h4 data-i18n="settings.cleanIncompleteDownloads">
                    Clean incomplete downloads
                  </h4>
                  <p data-i18n="settings.cleanIncompleteDownloadsDescription">
                    Remove leftover temporary files from cancelled or failed
                    downloads.
                  </p>
                </div>
                <button
                  type="button"
                  class="storage-location-button"
                  id="cleanup-incomplete-downloads"
                >
                  <span data-i18n="common.cleanUp">Clean up</span>
                </button>
              </div>
              <div class="setting-item">
                <div class="setting-info">
                  <h4 data-i18n="settings.multithreadStorageMoves">
                    Move files faster
                  </h4>
                  <p data-i18n="settings.multithreadStorageMovesDescription">
                    Copy up to four files at once when changing the WeekBox
                    storage location.
                  </p>
                </div>
                <label class="switch">
                  <input type="checkbox" id="setting-multithreadStorageMoves" />
                  <span class="slider round"></span>
                </label>
              </div>
            </div>
          </div>

          <!-- UPDATES TAB -->
          <div
            id="config-updates"
            class="config-tab-content"
            style="display: none"
          >
            <div class="settings-list">
              <div class="setting-item setting-item-storage">
                <div class="setting-info">
                  <h4 data-i18n="settings.weekboxUpdates">WeekBox updates</h4>
                  <p
                    id="app-update-status"
                    data-i18n="settings.weekboxUpdatesDescription"
                  >
                    Check GitHub Releases for a new WeekBox version.
                  </p>
                </div>
                <button
                  class="storage-location-button"
                  id="check-app-update"
                  type="button"
                >
                  <span data-i18n="settings.checkForUpdates"
                    >Check for updates</span
                  >
                </button>
              </div>

              <div class="setting-item">
                <div class="setting-info">
                  <h4 data-i18n="settings.checkAppUpdatesOnStartup">
                    Check WeekBox updates on startup
                  </h4>
                  <p data-i18n="settings.checkAppUpdatesOnStartupDescription">
                    Tell me when a newer WeekBox release is available.
                  </p>
                </div>
                <label class="switch">
                  <input
                    type="checkbox"
                    id="setting-checkAppUpdatesOnStartup"
                  />
                  <span class="slider round"></span>
                </label>
              </div>

              <div class="setting-item">
                <div class="setting-info">
                  <h4 data-i18n="settings.checkUpdatesOnStartup">
                    Check engine updates on startup
                  </h4>
                  <p data-i18n="settings.checkUpdatesOnStartupDescription">
                    Look for updates to installed engines when WeekBox opens.
                  </p>
                </div>
                <label class="switch">
                  <input type="checkbox" id="setting-checkUpdatesOnStartup" />
                  <span class="slider round"></span>
                </label>
              </div>

              <div class="setting-item">
                <div class="setting-info">
                  <h4 data-i18n="settings.checkUpdatesInBackground">
                    Check engine updates in background
                  </h4>
                  <p data-i18n="settings.checkUpdatesInBackgroundDescription">
                    Look again every three hours while WeekBox is open.
                  </p>
                </div>
                <label class="switch">
                  <input
                    type="checkbox"
                    id="setting-checkUpdatesInBackground"
                  />
                  <span class="slider round"></span>
                </label>
              </div>
            </div>
          </div>

        </div>
      </main>
    </div>
  </div>
</template>
<template id="tpl-engine-manager">
  <div
    class="mod-manager-overlay"
    id="engine-manager-modal"
    style="display: none"
  >
    <section
      class="mod-manager-content"
      role="dialog"
      aria-modal="true"
      aria-labelledby="engine-manager-title"
    >
      <header class="mod-manager-header">
        <h2 id="engine-manager-title" data-i18n="nav.engineManager">Engines</h2>
        <div class="mod-manager-header-actions">
          <button
            class="mod-manager-action-btn mod-manager-close-btn"
            id="engine-manager-close-btn"
            type="button"
            data-i18n-attr="title:common.close,aria-label:common.close"
            title="Close"
            aria-label="Close Engines"
          >
            <i class="fa-solid fa-xmark" aria-hidden="true"></i>
          </button>
        </div>
      </header>
