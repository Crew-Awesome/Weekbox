<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" href="favicon.ico" sizes="any" />
    <title>WeekBox</title>
    <meta
      http-equiv="Cache-Control"
      content="no-cache, no-store, must-revalidate"
    />
    <meta http-equiv="Pragma" content="no-cache" />
    <meta http-equiv="Expires" content="0" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
    />
    <link rel="stylesheet" href="dist/bundle.css?v=1" />
  </head>
  <body>
    <div
      id="startup-loading-screen"
      class="startup-loading"
      role="status"
      aria-live="polite"
    >
      <div class="startup-loading-card">
        <p
          id="startup-loading-title"
          class="startup-loading__title"
          data-i18n="app.loading"
        >
          Loading
        </p>
        <div
          class="startup-loading__progress-container"
          role="progressbar"
          data-i18n-attr="aria-label:app.startupProgress"
          aria-label="WeekBox startup progress"
          aria-valuemin="0"
          aria-valuemax="100"
          aria-valuenow="4"
        >
          <div
            id="startup-loading-progress"
            class="startup-loading__progress-bar"
          ></div>
        </div>
        <p id="startup-loading-label" class="startup-loading__label">
          <span data-i18n="app.starting">Starting WeekBox</span>
        </p>
      </div>
    </div>

    <div id="app" class="app-layout">
      <div id="sidebar-container" style="display: contents"></div>

      <main class="app-layout__content" id="main-content">
        <p data-i18n="app.loadingInterface">Loading interface...</p>
      </main>
    </div>

    <script src="src/backend/core/native/pc/neutralino.js"></script>
    <script type="module" src="dist/bundle.js?v=1"></script>
  </body>
</html>
