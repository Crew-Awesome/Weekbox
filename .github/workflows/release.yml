name: Build release assets

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to build
        required: true
        type: string

permissions:
  contents: write

jobs:
  build-and-upload:
    runs-on: windows-latest
    env:
      RELEASE_TAG: ${{ github.event.release.tag_name || inputs.tag }}

    steps:
      - name: Check out the release tag
        uses: actions/checkout@v5
        with:
          ref: ${{ env.RELEASE_TAG }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Sync release notes from CHANGELOG.md
        env:
          GH_TOKEN: ${{ github.token }}
        run: node .github/scripts/sync-release-notes.mjs "$env:RELEASE_TAG"

      - name: Install dependencies
        run: npm ci

      - name: Restore Neutralino runtime
        run: npx @neutralinojs/neu update

      - name: Build embedded executables
        run: npm run build

      - name: Package platform archives
        shell: pwsh
        run: |
          $version = (Get-Content neutralino.config.json -Raw | ConvertFrom-Json).version
          if ($env:RELEASE_TAG -ne "v$version") {
            throw "Release tag $env:RELEASE_TAG does not match app version $version."
          }

          $assets = @{
            'WeekBox-win_x64.exe' = "WeekBox-$version-windows-x64.zip"
          }

          New-Item -ItemType Directory -Path dist/release-assets -Force | Out-Null
          foreach ($binary in $assets.Keys) {
            $items = @("dist/WeekBox/$binary", "dist/WeekBox/resources.neu")
            if (Test-Path "dist/WeekBox/extensions") { $items += "dist/WeekBox/extensions" }
            Compress-Archive -LiteralPath $items -DestinationPath "dist/release-assets/$($assets[$binary])" -Force
          }

          Copy-Item "dist/WeekBox/resources.neu" "dist/release-assets/WeekBox-$version-resources.neu" -Force

      - name: Install Inno Setup 7
        shell: pwsh
        run: |
          $url = "https://github.com/jrsoftware/issrc/releases/download/is-7_0_2/innosetup-7.0.2-x86.exe"
          curl.exe -L -o "$env:TEMP\innosetup.exe" $url
          if ((Get-Item "$env:TEMP\innosetup.exe").Length -lt 5MB) {
            throw "Inno Setup download was too small and may be corrupted."
          }
          Start-Process "$env:TEMP\innosetup.exe" -ArgumentList "/VERYSILENT", "/SUPPRESSMSGBOXES", "/NORESTART" -Wait

      - name: Build Windows installer
        shell: pwsh
        run: |
          $version = (Get-Content neutralino.config.json -Raw | ConvertFrom-Json).version
          $iscc = Get-ChildItem "C:\Program Files*\Inno Setup 7\ISCC.exe" | Select-Object -First 1
          if (-not $iscc) { throw "Inno Setup 7 (ISCC.exe) was not found after install." }
          & $iscc.FullName /DMyAppVersion=$version installer\weekbox.iss
          Copy-Item "dist/installer/WeekBox-$version-windows-x64-setup.exe" "dist/release-assets/" -Force

      - name: Upload release assets
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          Get-ChildItem dist/release-assets | ForEach-Object {
            gh release upload $env:RELEASE_TAG $_.FullName --clobber
          }

  package-macos:
    runs-on: macos-latest
    env:
      RELEASE_TAG: ${{ github.event.release.tag_name || inputs.tag }}

    steps:
      - name: Check out the release tag
        uses: actions/checkout@v5
        with:
          ref: ${{ env.RELEASE_TAG }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Restore Neutralino runtime
        run: npx @neutralinojs/neu update

      - name: Build app bundle
        run: npm run build && npm run package:macos

      - name: Create macOS packages
        run: |
          version=$(node -p "require('./neutralino.config.json').version")
          if [ "$RELEASE_TAG" != "v$version" ]; then
            echo "Release tag $RELEASE_TAG does not match app version $version."
            exit 1
          fi

          mkdir -p dist/release-assets dist/release-archives
          for arch in arm64 universal x64; do
            staging="dist/release-archives/macos-$arch"
            mkdir -p "$staging"
            cp "dist/WeekBox/WeekBox-mac_$arch" "$staging/WeekBox-mac_$arch"
            cp dist/WeekBox/resources.neu "$staging/resources.neu"
            chmod +x "$staging/WeekBox-mac_$arch"
            (cd "$staging" && zip -X -q -r "$GITHUB_WORKSPACE/dist/release-assets/WeekBox-$version-macos-$arch.zip" .)
          done

          mkdir -p dist/packages/macos-dmg
          cp -R dist/packages/WeekBox.app dist/packages/macos-dmg/
          ditto -c -k --sequesterRsrc --keepParent dist/packages/WeekBox.app "dist/release-assets/WeekBox-$version-macos-universal.app.zip"
          hdiutil create -volname WeekBox -srcfolder dist/packages/macos-dmg -ov -format UDZO "dist/release-assets/WeekBox-$version-macos-universal.dmg"
          pkgbuild --component dist/packages/WeekBox.app --install-location /Applications "dist/release-assets/WeekBox-$version-macos-universal.pkg"

      - name: Upload macOS packages
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$RELEASE_TAG" dist/release-assets/* --clobber

  package-linux:
    runs-on: ubuntu-latest
    env:
      RELEASE_TAG: ${{ github.event.release.tag_name || inputs.tag }}

    steps:
      - name: Check out the release tag
        uses: actions/checkout@v5
        with:
          ref: ${{ env.RELEASE_TAG }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Restore Neutralino runtime
        run: npx @neutralinojs/neu update

      - name: Build Linux packages
        run: npm run build && npm run package:linux

      - name: Install AppImage tooling
        run: |
          curl --fail --location https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage --output "$RUNNER_TEMP/appimagetool"
          chmod +x "$RUNNER_TEMP/appimagetool"

      - name: Create Linux packages
        run: |
          version=$(node -p "require('./neutralino.config.json').version")
          if [ "$RELEASE_TAG" != "v$version" ]; then
            echo "Release tag $RELEASE_TAG does not match app version $version."
            exit 1
          fi

          mkdir -p dist/release-assets dist/release-archives
          for arch in arm64 armhf x64; do
            staging="dist/release-archives/linux-$arch"
            mkdir -p "$staging"
            cp "dist/WeekBox/WeekBox-linux_$arch" "$staging/WeekBox-linux_$arch"
            cp dist/WeekBox/resources.neu "$staging/resources.neu"
            chmod +x "$staging/WeekBox-linux_$arch"
            (cd "$staging" && zip -X -q -r "$GITHUB_WORKSPACE/dist/release-assets/WeekBox-$version-linux-$arch.zip" .)
          done

          "$RUNNER_TEMP/appimagetool" --appimage-extract-and-run dist/packages/WeekBox.AppDir "dist/release-assets/WeekBox-$version-linux-x86_64.AppImage"
          dpkg-deb --build --root-owner-group dist/packages/WeekBox-deb "dist/release-assets/WeekBox-$version-linux-amd64.deb"

      - name: Upload Linux packages
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$RELEASE_TAG" dist/release-assets/* --clobber

  refresh-downloads:
    needs: [build-and-upload, package-macos, package-linux]
    runs-on: ubuntu-latest
    steps:
      - name: Refresh the Downloads page
        env:
          REVALIDATE_SECRET: ${{ secrets.WEEKBOX_SITE_REVALIDATE_SECRET }}
        run: |
          if [ -z "$REVALIDATE_SECRET" ]; then
            echo "::error::WEEKBOX_SITE_REVALIDATE_SECRET is not configured."
            exit 1
          fi
          curl --fail-with-body --silent --show-error --request POST \
            --max-time 30 \
            'https://fnfweekbox.vercel.app/api/revalidate-release' \
            --header "Authorization: Bearer $REVALIDATE_SECRET"
